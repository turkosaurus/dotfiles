# keyd — evdev-level remapping, works under both Wayland and X11.
# Installed to /etc/keyd/default.conf by bin/install/keyd.
#
# Caps Lock and Esc swap places: Caps sends Esc, Esc sends Caps Lock.
# This replaces the GNOME-only `bin/key swap|norm` gsettings toggle,
# which has no effect outside GNOME.

[ids]

*

[main]

capslock = esc
esc = capslock
