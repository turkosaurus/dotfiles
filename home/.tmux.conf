set -g prefix2 C-Space
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[1 q"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm:Ms=\E]52;%p1%s;%p2%s\7'

bind r source-file ~/.tmux.conf \; display " reloaded .tmux.config";
bind-key s split-window -v -l 12 \; select-pane -D
bind \` switch-client -t '{marked}'

# tokyonight
set -g @primary "#e0af68"    # yellow
set -g @secondary "#7aa2f7"  # blue
set -g @background "#1a1b26"
# set -g @bglight "#24283b"

set -g status-bg "#1a1b26"
set -g status-style bold

# Left status
set -g status-left-length 40
set -g status-left \
	"#[fg=#{@background},bg=#{@secondary}] #(whoami)@#h •\
	#[fg=#{@background},bg=#{@secondary}] #S \
	#[fg=#{@secondary},bg=#{@background}]\
	#[default]"

# Right status
set -g status-right-length 100
set -g status-right \
	"#[fg=#{@secondary},bg=#{@background}]\
	#[fg=#{@background},bg=#{@secondary}]#(cat /sys/class/power_supply/BAT0/capacity)%\
	#[fg=#{@background},bg=#{@secondary}]#(pmset -g batt | awk '/InternalBattery/ {print $3}' | tr -d ';') \
	#[fg=#{@background},bg=#{@secondary}]%a %Y-%m-%d %H:%M \
	#[default]"

# Window status (bell flag changes colors to red)
setw -g window-status-format \
	"#[fg=#{?window_bell_flag,#f7768e,#{@background}},bg=#{@background}]\
	#[fg=#{?window_bell_flag,#{@background},#{@secondary}},bg=#{?window_bell_flag,#f7768e,#{@background}}] #I\
	#[fg=#{?window_bell_flag,#{@background},#{@secondary}},bg=#{?window_bell_flag,#f7768e,#{@background}}] #W \
	#[fg=#{?window_bell_flag,#f7768e,#{@background}},bg=#{@background}]\
	#[default]"
setw -g window-status-current-format \
	"#[fg=#{@primary},bg=#{@background}]\
	#[fg=#{@background},bg=#{@primary},bold] #I\
	#[fg=#{@background},bg=#{@primary}] #W \
	#[fg=#{@primary},bg=#{@background}]\
	#[default]"

set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-style "fg=#{@secondary}"            # inactive
set -g pane-active-border-style "fg=#{@primary},bold"  # active

set -g message-style "bg=#{@primary},fg=#{@background},bold" # popup error
set -g display-time 2400
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g history-limit 10000

# title (top)
set -g set-titles on
set -g set-titles-string "#S • #W #I.#P"

# window (bottom)
set -g automatic-rename off
set-hook -g pane-focus-in \
  "run-shell 'p=\"#{pane_current_path}\"; \
  name=\$(basename \"\$p\"); \
  case \"\$p\" in \$HOME/w/*) \
  branch=\$(git -C \"\$p\" rev-parse --abbrev-ref HEAD 2>/dev/null); \
  name=\"work:\${branch:-\$name}\" ;; \
  *) branch=\$(git -C \"\$p\" rev-parse --abbrev-ref HEAD 2>/dev/null); \
  [ -n \"\$branch\" ] && name=\"\$name:\$branch\" ;; esac; \
  tmux rename-window \"\$name\"'"

set-option -g set-clipboard on
setw -g mode-keys vi

# Vi-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection          # character-wise visual mode
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle       # block/rectangular visual mode
bind -T copy-mode-vi V send-keys -X select-line              # line-wise visual mode
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux save-buffer - | tmux load-buffer -"
bind p paste-buffer

bind - last-window
bind h if -F '#{pane_at_left}'   '' 'select-pane -L'   # no wrap if at edge
bind j if -F '#{pane_at_bottom}' '' 'select-pane -D'   # no wrap if at edge
bind k if -F '#{pane_at_top}'    '' 'select-pane -U'   # no wrap if at edge
bind l if -F '#{pane_at_right}'  '' 'select-pane -R'   # no wrap if at edge

# Leaderless nav (-n = -T root, no prefix), all on Alt.
bind -n M-Left  if -F '#{pane_at_left}'   '' 'select-pane -L'   # no wrap if at edge
bind -n M-Down  if -F '#{pane_at_bottom}' '' 'select-pane -D'   # no wrap if at edge
bind -n M-Up    if -F '#{pane_at_top}'    '' 'select-pane -U'   # no wrap if at edge
bind -n M-Right if -F '#{pane_at_right}'  '' 'select-pane -R'   # no wrap if at edge

# Alt+PageUp/Down switches to prev/next window.
bind -n M-PageUp   previous-window
bind -n M-PageDown next-window

# One-hand aliases (mirror the < / > swap-window bindings below).
bind -n M-,        previous-window
bind -n M-.        next-window

bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

bind -T root PageUp copy-mode -e

# Let OSC 133 (and other escapes) reach the outer terminal and
# capture-pane / pipe-pane, for shell-integration + agent workflows.
set -g allow-passthrough on

# bell-action: any | current | other | none
set -g bell-action any
# visual-bell: off (sound only) | on (flash only) | both
set -g visual-bell off
set -g monitor-bell on
setw -g window-status-bell-style "fg=#1a1b26,bg=#f7768e,bold"

# Nested tmux: F12 toggles prefix to inner session
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=colour245,bg=colour238,nobold" \;\
  set @primary "colour250" \;\
  set @secondary "colour240" \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u @primary \;\
  set -u @secondary \;\
  refresh-client -S

set -g aggressive-resize on

set-hook -g session-created {
    if -F '#{==:#{session_name},0}' {
        new-session -d -t 0 -s side
        new-session -d -t 0 -s mini
        new-session -d -t 0 -s alt
    }
}

set-option -g focus-events on
set-option -sg escape-time 10
set-option -g default-command "cd $(pwd); $SHELL"
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# session capture/restore: resurrect (manual prefix+C-s / prefix+C-r)
# + continuum (autosave every 15m, restore on server start). Loaded
# last on purpose — continuum wraps status-right at load time, so
# nothing may set status-right below this block.
set -g @resurrect-processes 'vi vim nvim man less more tail top htop gh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

if "test ! -d ~/.tmux/plugins/tmux-resurrect" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tmux-resurrect ~/.tmux/plugins/tmux-resurrect'"
if "test ! -d ~/.tmux/plugins/tmux-continuum" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tmux-continuum ~/.tmux/plugins/tmux-continuum'"
run ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run ~/.tmux/plugins/tmux-continuum/continuum.tmux


