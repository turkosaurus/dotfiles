# gh-dash. Everything visual lives under `theme:`. A top-level `ui:`
# or `colors:` parses cleanly and is then ignored, which is how this
# file sat inert for a while.
#
# Note `showSeparator` is singular. The upstream docs spell it
# `showSeparators`; the struct tag in internal/config/parser.go does
# not, and the struct tag wins.

defaults:
  preview:
    open: true
    width: 50
  layout:
    prs:
      # base is almost always the default branch, and the diff size
      # is already in the preview pane.
      base:
        hidden: true
      lines:
        hidden: true

theme:
  ui:
    sectionsShowCount: true
    table:
      compact: true
      showSeparator: false
  icons:
    inline:
      newcontributor: "󰎔"
      contributor: ""
      collaborator: ""
      member: ""
      owner: ""
      unknownrole: "󰭙"
